<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | J.D.G digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo"><strong>J.D.G</strong> <span>digital</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="page-section">
    <h1>Contact Me</h1>
    <p>Have a project or idea? Let’s talk!</p>

    <form class="contact-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 J.D.G digital | All Rights Reserved</p>
  </footer>

  <!-- Background Transition Script -->
  <script>
    const gradients = [
      "linear-gradient(135deg, #1d3557, #457b9d, #a8dadc)",
      "linear-gradient(135deg, #d4fc79, #96e6a1)",
      "linear-gradient(135deg, #ff9a9e, #fad0c4)",
      "linear-gradient(135deg, #89f7fe, #66a6ff)",
      "linear-gradient(135deg, #fbc2eb, #a6c1ee)"
    ];
    document.body.style.background = gradients[Math.floor(Math.random() * gradients.length)];
  </script>
</body>
</html>
