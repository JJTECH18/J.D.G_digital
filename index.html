<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | J.D.G digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo"><strong>J.D.G</strong> <span>digital</span></div>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <h1>Sign Up to Work With a Web Developer Who Delivers</h1>
      <p>Join my network to get updates, offers, and professional web services.</p>
    </div>

    <!-- Sign-Up Card -->
    <div class="signup-card">
      <h2>Create Account</h2>
      <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>

        <label class="checkbox">
          <input type="checkbox" required>
          I agree to the terms and conditions
        </label>

        <button type="submit">Sign Up Now</button>
      </form>
      <p class="login-text">Already have an account? <a href="#">Log in</a></p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 J.D.G digital | All Rights Reserved</p>
  </footer>

  <!-- Background Transition Script -->
  <script>
    const gradients = [
      "linear-gradient(135deg, #1d3557, #457b9d, #a8dadc)",
      "linear-gradient(135deg, #d4fc79, #96e6a1)",
      "linear-gradient(135deg, #ff9a9e, #fad0c4)",
      "linear-gradient(135deg, #89f7fe, #66a6ff)",
      "linear-gradient(135deg, #fbc2eb, #a6c1ee)"
    ];
    document.body.style.background = gradients[Math.floor(Math.random() * gradients.length)];
  </script>
</body>
</html>
